# CI do Vetor: build + testes de unidade dos três projetos e, em seguida, a suíte e2e inteira (API, painel e app no
# navegador) contra um Postgres novo com o seed. Ver e2e/README.md e vetor-backend/README-backend.md.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  build:
    name: Build e testes de unidade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            vetor-backend/package-lock.json
            vetor-app-web/package-lock.json
            vetor-app-mobile/package-lock.json

      - name: Backend — instalar, gerar o Prisma Client, build e testes de unidade
        working-directory: vetor-backend
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test

      - name: Painel web — build de produção
        working-directory: vetor-app-web
        run: |
          npm ci
          npm run build

      - name: App mobile — build de produção
        working-directory: vetor-app-mobile
        run: |
          npm ci
          npm run build

  e2e:
    name: e2e (API + painel + app no Chrome)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vetor
          POSTGRES_PASSWORD: vetor
          POSTGRES_DB: vetor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetor -d vetor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            vetor-backend/package-lock.json
            vetor-app-web/package-lock.json
            vetor-app-mobile/package-lock.json

      - name: API — banco do zero (migrations + seed) e subir
        working-directory: vetor-backend
        run: |
          cp .env.example .env
          npm ci
          npx prisma migrate deploy
          npm run prisma:seed
          npm run build
          nohup node dist/main > ../api.log 2>&1 &

      - name: Painel e app — subir os servidores de desenvolvimento
        run: |
          (cd vetor-app-web && npm ci && nohup npx ng serve --port 4200 > ../web.log 2>&1 &)
          (cd vetor-app-mobile && npm ci && nohup npx ng serve --port 8100 > ../mobile.log 2>&1 &)

      # anotações (públicas) dizem qual servidor não subiu e o fim do log dele — o log do job só abre pra admin
      - name: Esperar API, painel e app responderem
        run: |
          for alvo in "http://localhost:3000/api/health api.log" "http://localhost:4200/ web.log" "http://localhost:8100/ mobile.log"; do
            set -- $alvo
            for i in $(seq 1 240); do curl -sf "$1" > /dev/null && break; sleep 2; done
            if ! curl -sf "$1" > /dev/null; then
              echo "::error title=não subiu::$1 (log: $2)"
              tail -n 15 "$2" | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error title=$2::$l"; done
              exit 1
            fi
          done

      - name: Suíte e2e
        run: |
          set -o pipefail
          CHROME_BIN=google-chrome node e2e/run-all.mjs 2>&1 | tee e2e.log

      # o log do Actions só abre pra quem administra o repositório; anotações são públicas (API de check-runs)
      - name: Resultado do e2e como anotações
        if: always()
        run: |
          awk '/^== /{suite=substr($0,4)} /^(FAIL|ERRO) /{gsub(/%/,"%25"); print "::error title=" suite "::" $0} /PASS · /{print "::notice title=e2e::" $0}' e2e.log || true

      - name: Logs dos servidores (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-servidores
          path: |
            api.log
            web.log
            mobile.log
            e2e.log
