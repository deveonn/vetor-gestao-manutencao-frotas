<div class="profile">
  <div class="profile__head">
    <div class="profile__title">perfil</div>
  </div>

  <div class="profile__card">
    <div class="profile__avatar"><span class="ms">person</span></div>
    <div class="profile__name">{{ session.session()?.nome }}</div>
    <div class="profile__username tabular">{{ '@' + session.session()?.username }}</div>
  </div>

  <div class="profile__spacer"></div>

  <div class="profile__footer">
    <button class="btn-secondary" (click)="confirmLogout()">
      <span class="ms">logout</span>
      sair da conta
    </button>
    <div class="profile__version tabular">vetor · v{{ appVersion }}</div>
  </div>
</div>
